name: Autonomous Engineering - Policy Tests

on:
  pull_request:
    paths:
      - 'scripts/autonomous_*.py'
      - 'tests/design_management/test_autonomous_*.py'
      - '.github/workflows/autonomous-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    name: Autonomous engineering policy (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline policy, dispatch, risk and merge regression tests
        run: python -m unittest discover -s tests/design_management -p 'test_*.py' -v
