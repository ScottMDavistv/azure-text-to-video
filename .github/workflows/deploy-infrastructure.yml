name: Legacy Foundation Deployment — Disabled
# Legacy foundation deployment intentionally disabled.
# infra/main.bicep currently previews changes to existing non-worker resources.
# Use guarded-azure-worker-deploy.yml for an allowlisted dev worker operation.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Deny broad foundation deployment
        run: |
          echo "::error::Broad foundation deployment disabled. Use a targeted reviewed workflow."
          exit 1
