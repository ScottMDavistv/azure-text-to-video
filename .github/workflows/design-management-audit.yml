name: Design Management - Twice Daily Audit

on:
  schedule:
    # Twice daily, approximately morning and evening in Mountain Time.
    # UTC scheduling does not automatically adjust for daylight saving.
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: design-management-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Offline agent regression tests
        run: python -m unittest discover -s tests/design_management -p 'test_*.py' -v
      # Azure OIDC inventory has moved to azure-readonly-operations.yml,
      # with a protected environment and immutable repository OIDC subject.
      # This governance publishing job must never request OIDC credentials.
      - name: Collect evidence and update issue 16
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESIGN_MANAGEMENT_PUBLISH: 'true'
        run: python scripts/design_management_audit.py
      - name: Verify issue 16 contains this run's exact snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_design_management_publication.py
      - name: Route approved development work and update agent queues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESIGN_MANAGEMENT_PUBLISH: 'true'
        run: python scripts/design_agent_coordination.py
      - name: Upload audit snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-management-snapshot
          path: |
            design-management-report.md
            azure-inventory.json
            design-management-queues.json
          if-no-files-found: ignore
