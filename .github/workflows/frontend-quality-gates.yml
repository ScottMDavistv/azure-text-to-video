name: Frontend Quality Gates

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tools/c1-harness/**'
      - '.github/workflows/frontend-quality-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend-quality:
    name: Frontend tests, lint and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend unit tests when the test suite is present
        working-directory: frontend
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test
          elif [ "${{ github.event_name }}" = "pull_request" ] && git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- .; then
            echo 'Workflow-only PR: no frontend test script exists on base yet.'
          else
            echo 'No frontend test script found; add npm test before merging frontend feature work.'
            exit 1
          fi
      - name: Run exact-head offline C1 browser regressions and security mutations
        working-directory: frontend
        timeout-minutes: 15
        env:
          C1_LIVE: '0'
          C1_UNCONFIGURED: '0'
          C1_MUTATION_MODE: '0'
          C1_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # The PR head is tested directly; avoid validating only a synthetic merge commit.
          # Read-only checkout, zero secrets, zero Entra/Azure/FAL requests.
          git checkout --detach "$C1_PR_HEAD"
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.65.1
          # Fail if the extra install drifted any locked dependency (PR #71 review F-1).
          node e2e/c1-lockfile-check.mjs
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.config.mjs --workers=1
          C1_UNCONFIGURED=1 npx playwright test --config=playwright.config.mjs --workers=1
          node e2e/c1-mutation-check.mjs
          node e2e/run-browser-mutations.mjs
          # L-2: fail closed unless unrestricted Chromium actually sends STUN,
          # followed by zero UDP delivery with browser-enforced policy.
          xvfb-run -a node e2e/c1-webrtc-udp-check.mjs
          node e2e/c1-lockfile-check.mjs
          git checkout --detach "$GITHUB_SHA"
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
      - name: Headless Chromium account and project session-race regressions
        working-directory: frontend
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node e2e/run-browser-race.mjs

      - name: Confirm non-deploying security boundary
        run: |
          echo 'Local frontend quality checks only.'
          echo 'No Azure deployment, FAL/provider calls, or automatic merge.'

  c1-harness:
    name: C1 harness syntax, ShellCheck and regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact head without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline harness gates
        run: |
          set -euo pipefail
          if [[ ! -d tools/c1-harness ]]; then
            echo 'C1 harness is absent at this head.'
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck xvfb x11vnc novnc websockify fluxbox xauth iproute2
          mapfile -d '' -t scripts < <(find tools/c1-harness -type f -name '*.sh' -print0)
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck --severity=error --external-sources --source-path=SCRIPTDIR "${scripts[@]}"
          bash tools/c1-harness/c1-session.sh --help
          bash tools/c1-harness/c1-session.sh selftest
