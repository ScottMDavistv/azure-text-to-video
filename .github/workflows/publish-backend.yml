name: Publish FastAPI Backend Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Push Backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name acrtextvideo1794671698

      - name: Build Docker image
        run: |
          docker build \
            -t acrtextvideo1794671698.azurecr.io/textvideo-api:${{ github.sha }} \
            ./backend

      - name: Push Docker image
        run: |
          docker push \
            acrtextvideo1794671698.azurecr.io/textvideo-api:${{ github.sha }}

      - name: Display published image
        run: |
          echo "Published image:"
          echo "acrtextvideo1794671698.azurecr.io/textvideo-api:${{ github.sha }}"
