name: Design Management - Regression Tests

on:
  pull_request:
    paths:
      - 'scripts/design_management_audit.py'
      - 'tests/design_management/**'
      - '.github/workflows/design-management-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/design_management -p 'test_*.py' -v
