name: Frontend Local Entra Auth

on:
  push:
    branches:
      - feature/bulk-03-integrated
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-local-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    if: github.ref == 'refs/heads/feature/bulk-03-integrated'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize npm lockfile after MSAL addition
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Verify frontend TypeScript build
        working-directory: frontend
        run: npm run build
      - name: Verify lint
        working-directory: frontend
        run: npm run lint
      - name: Commit updated frontend lockfile only
        run: |
          set -euo pipefail
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "B1: synchronize MSAL frontend dependency lockfile"
            git push origin HEAD:feature/bulk-03-integrated
          else
            echo "Frontend lockfile already synchronized."
          fi
      - name: Ensure no paid actions
        run: |
          echo 'Frontend build only; no Azure deployment or paid FAL usage.'
