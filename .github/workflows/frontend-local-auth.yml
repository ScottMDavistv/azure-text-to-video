name: Frontend Local Entra Auth (read-only legacy verification)

# Former branch self-push workflow retired; no write token and no automatic lockfile commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Verify existing MSAL frontend without repository writes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted main without Git credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked dependencies (never mutate lockfile)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify frontend TypeScript build
        working-directory: frontend
        run: npm run build
      - name: Verify lint
        working-directory: frontend
        run: npm run lint
      - name: Verify safe execution boundary
        run: echo 'Read-only frontend verification only; no Git push, Azure, or paid provider calls.'
