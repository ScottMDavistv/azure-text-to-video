name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    name: Security checks (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      VIDEO_PROVIDER: disabled
      VIDEO_RENDER_PROVIDER: disabled
      ENABLE_PAID_FAL_WORKER: 'false'
      ENABLE_LIVE_VIDEO_RENDERING: 'false'
      ENABLE_WORKER_CONSUMPTION: 'false'
      FAL_KEY: ''
      FAL_API_KEY: ''
      AZURE_CLIENT_ID: ''
      AZURE_TENANT_ID: ''
      AZURE_SUBSCRIPTION_ID: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check paid rendering invariant and obvious secrets
        run: python scripts/security_invariants.py

      - name: Test protected Azure deployment governance (offline)
        run: python scripts/check_azure_deployment_governance.py

      - name: Install automated security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'bandit==1.8.6' 'pip-audit==2.9.0'

      - name: Python security static analysis
        run: bandit -r backend -ll -ii -x backend/tests

      - name: Audit Python dependencies against vulnerability advisories
        run: python -m pip_audit --requirement backend/requirements.txt --progress-spinner off

      - name: Summarize safeguards
        if: always()
        run: |
          echo '## Single-owner automated security checks' >> "$GITHUB_STEP_SUMMARY"
          echo '- No Azure deployment or paid FAL calls are performed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Failures must be remediated or explicitly reviewed; no silent bypass.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Automated scans are not equivalent to an independent human security review.' >> "$GITHUB_STEP_SUMMARY"
