name: Preview Azure Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    name: Azure Bicep What-If
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group rg-textvideo-dev \
              --template-file infra/main.bicep \
              --parameters \
                location=eastus \
                storageAccountName=sttextvideo1794671698 \
                logAnalyticsName=log-textvideo-dev \
                containerAppsEnvironmentName=cae-textvideo-dev \
              --result-format ResourceIdOnly
