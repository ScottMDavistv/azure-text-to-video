name: Guarded Azure Dev Worker Deployment
on:
  push:
    branches: [main]
    paths:
      - 'infra/worker-job.bicep'
      - 'infra/worker-job.intent.json'
      - 'scripts/validate-worker-infrastructure.py'
      - 'scripts/validate-fal-keyvault-iac.py'
      - 'scripts/verify_azure_worker_safe.py'
      - 'scripts/verify_worker_image_whatif.py'
      - '.github/workflows/guarded-azure-worker-deploy.yml'
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preview or supervised worker deployment
        type: choice
        options: [preview, whatif, deploy]
        required: true
      confirmation:
        description: For What-If, type PREVIEW-DEV-WORKER; for deploy, type DEPLOY-DEV-WORKER
        required: false
        type: string
      approved_sha:
        description: For What-If or deploy, paste the full reviewed main commit SHA
        required: false
        type: string
      approved_preview_target:
        description: For What-If only, enter rg-textvideo-dev/job-textvideo-worker-dev
        required: false
        type: string
      approved_preview_digest:
        description: For What-If only, enter the full reviewed sha256 image digest
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: azure-dev-worker-deployment
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on unsafe intent
        run: |
          python scripts/validate-worker-infrastructure.py
          python scripts/validate-fal-keyvault-iac.py
          test "$OPERATION" = preview -o "$OPERATION" = whatif -o "$OPERATION" = deploy
          if [ "$OPERATION" = whatif ] || [ "$OPERATION" = deploy ]; then
            test "$TRIGGER_ACTOR" = ScottMDavistv
          fi
          if [ "$OPERATION" = deploy ]; then
            test "$APPROVED_SHA" = "$GITHUB_SHA"
            test "${#APPROVED_SHA}" -eq 40
            test "$CONFIRMATION" = DEPLOY-DEV-WORKER
            test "$DEPLOY_ENABLED" = true
            test "$MAIN_PROTECTED" = true
          fi
        env:
          TRIGGER_ACTOR: ${{ github.actor }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'preview' }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_ENABLED: ${{ vars.AZURE_DEV_DEPLOY_ENABLED }}
          MAIN_PROTECTED: ${{ vars.PROTECTED_MAIN_VERIFIED }}
  preview:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.operation == 'preview' || inputs.operation == 'deploy') && github.actor == 'ScottMDavistv'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: dev-deployment
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify subscription and deployment safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "41fbffdc-1793-44f9-b70f-220ea8a9bc6c"
          az identity show -g rg-textvideo-dev -n id-textvideo-worker-dev --output none
          python scripts/verify_azure_worker_safe.py
      - name: Read-only worker inventory (no ARM deployment permissions)
        shell: bash
        run: |
          set -euo pipefail
          az containerapp job show -g rg-textvideo-dev -n job-textvideo-worker-dev \
            --query '{name:name,trigger:properties.configuration.triggerType,profile:properties.workloadProfileName}' -o json
  whatif:
    needs: preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && github.actor == 'ScottMDavistv' && vars.PROTECTED_MAIN_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: dev-deployment-apply
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Supervised Bicep what-if
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "41fbffdc-1793-44f9-b70f-220ea8a9bc6c"
          python scripts/verify_azure_worker_safe.py
          umask 077
          preview_file="$(mktemp)"
          trap 'rm -f "$preview_file"' EXIT
          az deployment group what-if -g rg-textvideo-dev \
            --template-file infra/worker-job.bicep \
            --parameters workerImage="$WORKER_IMAGE" \
            --result-format FullResourcePayloads --output json > "$preview_file"
          python scripts/verify_worker_image_whatif.py "$preview_file"
        env:
          WORKER_IMAGE: acrtextvideo1794671698.azurecr.io/textvideo-worker@sha256:219ebbe03d9b1356a4091912b4955c1987ba8a0131a4e084953ab3796b5f0646
  whatif_admission:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'whatif' && github.actor == 'ScottMDavistv' && github.triggering_actor == 'ScottMDavistv' && github.run_attempt == '1' && vars.PROTECTED_MAIN_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deadline: ${{ steps.admit.outputs.deadline }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact approval without Azure credentials
        id: admit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          APPROVED_TARGET: ${{ inputs.approved_preview_target }}
          APPROVED_DIGEST: ${{ inputs.approved_preview_digest }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          deadline="$(gh api --hostname github.com "repos/ScottMDavistv/azure-text-to-video/actions/runs/$GITHUB_RUN_ID" \
            | python3 -I scripts/verify_worker_whatif_dispatch.py)"
          [[ "$deadline" =~ ^[1-9][0-9]{9}$ ]]
          printf 'deadline=%s\n' "$deadline" >> "$GITHUB_OUTPUT"
  owner_whatif:
    needs: whatif_admission
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'whatif' && github.actor == 'ScottMDavistv' && github.triggering_actor == 'ScottMDavistv' && github.run_attempt == '1' && vars.PROTECTED_MAIN_VERIFIED == 'true' && vars.AZURE_DEV_WHATIF_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment: dev-worker-whatif-preview
    env:
      APPROVAL_DEADLINE: ${{ needs.whatif_admission.outputs.deadline }}
      PREVIEW_CLIENT_ID: ${{ vars.AZURE_WHATIF_CLIENT_ID }}
      APPROVED_DIGEST: ${{ inputs.approved_preview_digest }}
      AUDIT_CLIENT_ID: ${{ vars.AZURE_PREVIEW_CLIENT_ID }}
      DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
    steps:
      - name: Confirm approval validity and isolated identity before Azure login
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL_DEADLINE" =~ ^[1-9][0-9]{9}$ ]]
          (( $(date +%s) < APPROVAL_DEADLINE ))
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$PREVIEW_CLIENT_ID" =~ $uuid && "$AUDIT_CLIENT_ID" =~ $uuid && "$DEPLOY_CLIENT_ID" =~ $uuid ]]
          [[ "${PREVIEW_CLIENT_ID,,}" != "${AUDIT_CLIENT_ID,,}" && "${PREVIEW_CLIENT_ID,,}" != "${DEPLOY_CLIENT_ID,,}" ]]
          version="$(az version --query '"azure-cli"' -o tsv)"
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$(printf '%s\n' 2.76.0 "$version" | sort -V | head -1)" = 2.76.0 ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Confirm exact checked-out SHA and approval deadline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$APPROVAL_DEADLINE" =~ ^[1-9][0-9]{9}$ ]]
          (( $(date +%s) < APPROVAL_DEADLINE ))
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_WHATIF_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Preview only the approved image change
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "41fbffdc-1793-44f9-b70f-220ea8a9bc6c"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/verify_azure_worker_safe.py
          umask 077
          preview_file="$(mktemp)"
          trap 'rm -f "$preview_file"' EXIT
          [[ "$APPROVAL_DEADLINE" =~ ^[1-9][0-9]{9}$ ]]
          (( $(date +%s) < APPROVAL_DEADLINE ))
          [[ "$WORKER_IMAGE" = "acrtextvideo1794671698.azurecr.io/textvideo-worker@$APPROVED_DIGEST" ]]
          az deployment group what-if -g rg-textvideo-dev \
            --template-file infra/worker-job.bicep \
            --parameters workerImage="$WORKER_IMAGE" \
            --validation-level ProviderNoRbac \
            --result-format FullResourcePayloads --output json > "$preview_file"
          python scripts/verify_worker_image_whatif.py "$preview_file"
        env:
          WORKER_IMAGE: acrtextvideo1794671698.azurecr.io/textvideo-worker@sha256:219ebbe03d9b1356a4091912b4955c1987ba8a0131a4e084953ab3796b5f0646
  deploy:
    needs: whatif
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' && github.actor == 'ScottMDavistv' && inputs.approved_sha == github.sha && inputs.confirmation == 'DEPLOY-DEV-WORKER' && vars.AZURE_DEV_DEPLOY_ENABLED == 'true' && vars.PROTECTED_MAIN_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    environment: dev-deployment-apply
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy allowlisted worker template
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "41fbffdc-1793-44f9-b70f-220ea8a9bc6c"
          python scripts/validate-worker-infrastructure.py
          python scripts/validate-fal-keyvault-iac.py
          python scripts/verify_azure_worker_safe.py
          # Recheck the exact change immediately before apply; a prior job's
          # exit code or manually approved summary is not proof of scope.
          umask 077
          preview_file="$(mktemp)"
          trap 'rm -f "$preview_file"' EXIT
          az deployment group what-if -g rg-textvideo-dev \
            --template-file infra/worker-job.bicep \
            --parameters workerImage="$WORKER_IMAGE" \
            --result-format FullResourcePayloads --output json > "$preview_file"
          python scripts/verify_worker_image_whatif.py "$preview_file"
          az deployment group create -g rg-textvideo-dev \
            --name "dev-worker-${{ github.run_id }}" \
            --template-file infra/worker-job.bicep \
            --parameters workerImage="$WORKER_IMAGE" \
            --output none
          python scripts/verify_azure_worker_safe.py
        env:
          WORKER_IMAGE: acrtextvideo1794671698.azurecr.io/textvideo-worker@sha256:219ebbe03d9b1356a4091912b4955c1987ba8a0131a4e084953ab3796b5f0646
