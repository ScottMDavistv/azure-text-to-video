name: Azure Read-Only Operations
on:
  pull_request:
    paths:
      - '.github/workflows/azure-readonly-operations.yml'
      - 'scripts/azure_readonly_operations.py'
      - 'tests/design_management/test_azure_readonly_operations.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/azure-readonly-operations.yml'
      - 'scripts/azure_readonly_operations.py'
      - 'tests/design_management/test_azure_readonly_operations.py'
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-readonly-operations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    name: Offline Azure audit safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Exercise mocked read-only Azure evidence and failure gates
        run: python -m unittest discover -s tests/design_management -p 'test_azure_readonly_operations.py' -v

  audit:
    name: Reader-only Azure preflight
    needs: offline-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_AUDIT_OPERATIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-readonly-audit
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_AUDIT_CLIENT_ID: ${{ vars.AZURE_AUDIT_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Fail closed unless the dedicated Reader identity is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_AUDIT_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      - name: Login with Reader identity (OIDC, no client secrets)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_AUDIT_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read-only Azure worker, registry, identity and RBAC preflight
        run: python scripts/azure_readonly_operations.py
      - name: Publish sanitized evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: azure-readonly-operations
          path: |
            azure-readonly-operations.json
            azure-readonly-operations.md
          if-no-files-found: warn
          retention-days: 14
