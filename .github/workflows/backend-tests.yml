name: Backend Python Tests

on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      VIDEO_PROVIDER: disabled
      ENABLE_PAID_FAL_WORKER: 'false'
      ENABLE_PROJECT_ROUTES: 'false'
      FAL_KEY: ''
      FAL_API_KEY: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Run project foundation tests
        run: python -m pytest -q backend/tests/test_project_foundation.py
      - name: Run all backend tests
        run: python -m pytest -q backend/tests
      - name: Verify disabled paid-rendering defaults
        run: |
          test "$VIDEO_PROVIDER" = disabled
          test "$ENABLE_PAID_FAL_WORKER" = false
          test "$ENABLE_PROJECT_ROUTES" = false
