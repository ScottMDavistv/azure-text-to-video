name: Backend Python Tests

on:
  push:
    branches:
      - 'feature/**'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      VIDEO_PROVIDER: disabled
      ENABLE_PAID_FAL_WORKER: 'false'
      ENABLE_PROJECT_ROUTES: 'false'
      FAL_KEY: ''
      FAL_API_KEY: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Run project foundation tests
        run: python -m pytest -q backend/tests/test_project_foundation.py
      - name: Run all backend tests
        run: python -m pytest -q backend/tests
      - name: Test signed Entra finance authorization
        run: python -m pytest -q backend/tests/test_finance_authorization.py

      - name: Start isolated local Azurite Table emulator
        run: |
          docker run --rm -d --name finance-azurite-ci -p 10002:10002 mcr.microsoft.com/azure-storage/azurite:latest azurite --tableHost 0.0.0.0 --blobHost 0.0.0.0 --queueHost 0.0.0.0
          python - <<'PY'
          import socket, time
          for attempt in range(40):
              try:
                  with socket.create_connection(("127.0.0.1", 10002), timeout=1):
                      print("Azurite Table port reachable")
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise RuntimeError("Azurite did not become ready")
          PY
          docker ps --filter name=finance-azurite-ci
          docker logs finance-azurite-ci
          python - <<'PY'
          import uuid
          from azure.data.tables import TableServiceClient
          endpoint = ("DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;"
                      "AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;"
                      "TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;")
          svc = TableServiceClient.from_connection_string(endpoint)
          name = "Health" + uuid.uuid4().hex[:16]
          import time
          last_error = None
          for attempt in range(40):
              try:
                  svc.create_table(name)
                  svc.delete_table(name)
                  print("Azurite Table API ready")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise RuntimeError("Azurite Table API did not become ready") from last_error
          svc.close()
          PY

      - name: Run Azure SDK finance contention and crash-recovery tests
        env:
          AZURITE_TABLE_TEST: '1'
        run: python -m pytest -q backend/tests/test_azurite_finance_integration.py

      - name: Test Azure SDK retry-after-commit fault injection
        env:
          AZURITE_TABLE_TEST: '1'
        run: python -m pytest -q backend/tests/test_azurite_finance_sdk_retry.py

      - name: Verify actual disabled provider and worker readiness defaults
        run: python -m pytest -q backend/tests/test_paid_safety_defaults.py
