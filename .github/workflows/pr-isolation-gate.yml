name: Trusted PR Workflow Isolation Gate

# Trusted scanner runs from protected main; PR contents are read only as YAML data.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-pr-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Trusted workflow isolation (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main scanner without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout untrusted PR files as inert data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Configure trusted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-pinned YAML parser
        run: "python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r trusted/scripts/ci-isolation-requirements.txt"
      - name: Validate PR workflow YAML using only trusted code
        run: python trusted/scripts/check_ci_isolation.py --root candidate
