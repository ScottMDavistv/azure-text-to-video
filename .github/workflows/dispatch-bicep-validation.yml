name: Validate Dispatch Reconciliation Bicep

on:
  pull_request:
    paths:
      - 'infra/dispatch-reconcile-job.bicep'
      - 'infra/dispatch-recovery-alerts.bicep'
      - '.github/workflows/dispatch-bicep-validation.yml'
      - 'scripts/validate-dispatch-reconciliation-readiness.py'
      - 'backend/tests/test_dispatch_deployment_readiness.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-bicep-validation:
    name: Validate dispatch Bicep templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bicep CLI
        run: |
          set -euo pipefail
          # Version and SHA-256 are pinned to the published Azure/bicep v0.48.1 asset.
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output bicep https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          echo 'b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  bicep' | sha256sum --check --status
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Static fail-closed release policy and negative-path tests
        run: |
          python scripts/validate-dispatch-reconciliation-readiness.py
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q backend/tests/test_dispatch_deployment_readiness.py

      - name: Compile scheduled reconciliation job
        run: bicep build infra/dispatch-reconcile-job.bicep --stdout > /dev/null

      - name: Compile Azure Monitor anomaly alerts
        run: bicep build infra/dispatch-recovery-alerts.bicep --stdout > /dev/null

      - name: Summarize validation only
        run: |
          echo 'Bicep templates compile; no Azure deployment or paid provider actions occurred.' >> "$GITHUB_STEP_SUMMARY"
